# o2a_gen configuration. Copy to gen_config.yaml and edit.

llm:
  provider: callable                                   # callable | fake (dry run)
  chat: o2a_gen.providers.tachyon_provider:chat        # module:function
  embed: o2a_gen.providers.deepinfra_provider:embed    # used when embedding.provider = llm (needs DEEPINFRA_API_KEY)
  max_concurrency: 8                                   # parallel calls to Tachyon

# Model identifiers exactly as Tachyon expects them. Use the same names you put
# in the `model:` field of LlmAgent YAMLs.
models:
  extract: REPLACE_WITH_TACHYON_MODEL          # reads the procedure, needs a strong model
  ground: REPLACE_WITH_TACHYON_MODEL           # writes SQL / transforms / prompts
  navigate: REPLACE_WITH_TACHYON_MODEL         # browses the catalog tree, many short turns
  catalog_summary: REPLACE_WITH_TACHYON_MODEL  # compile-time cluster summaries
  catalog_cards: REPLACE_WITH_TACHYON_MODEL    # compile-time, one call per catalog doc: a cheap model is fine
  llm_agent: REPLACE_WITH_TACHYON_MODEL        # written into generated LlmAgent YAMLs

# One embedding model is used for BOTH the catalog (tools, metadata, agent syntax, reference) and
# the procedure's sections, so their vectors can be compared. Changing any of model / dimensions /
# document_template means rebuilding the catalog (compile-catalog); old vectors are then ignored.
embedding:
  provider: llm                    # llm = the llm.embed function above (DeepInfra); local = sentence-transformers on a GPU
  model: nvidia/Nemotron-3-Embed-8B-BF16   # the ID as DeepInfra lists it (their API page shows nvidia/Nemotron-3-Embed-8B)
  batch_size: 32                   # texts per API call
  dimensions: 1024                 # optional: keep the first N of 4096 dims (smaller vectors.npy)
  # For provider: local only (self-hosted, ~16 GB GPU):
  # trust_remote_code: true
  # dtype: bfloat16
  # device: cuda
  # max_seq_length: 4096
  # Documents are embedded as-is (no prefix). Procedure-section -> catalog matching is a search,
  # so it may use the model's query format. Check the exact format on the model card.
  query_template: "Instruct: {instruction}\nQuery: {text}"
  query_instruction: "Given a step from an operations review procedure, find the database tables, tools and reference documents needed to implement it"

catalog:
  engine: native                   # native = o2a_gen.skilltree (default); corpus2skill = vendored third-party
  # native engine
  branching: 8                     # max sub-folders per folder
  leaf_max: 12                     # max documents listed in one folder
  min_group: 2
  max_depth: 4
  use_cards: true                  # one LLM call per doc (cached by content hash); false = no per-doc calls
  partition_by_kind: true          # top folders: agent-syntax / data-metadata / tools / reference-docs
  workers: 8
  # corpus2skill engine only
  p: 10
  max_top: 8
  min_cluster_size: 3
  use_doc_summaries: true

generation:
  prefix: pmi_ddn                  # agent / session-key name prefix
  pipeline_inputs: [loan_number]   # session keys supplied by the caller, not produced by any agent
  default_db_type: teradata
  default_connection_env: ECRM_DB_CONN   # used when the catalog doesn't say which connection a table uses
  navigate_max_turns: 12
  compile_procedure: true          # compile the procedure into its own skill tree (summaries, embeddings,
                                   # related sections, likely tools & data per section)
  # Extra fields merged into every generated agent of that class, for runtime
  # settings the procedure can't tell us (timeouts, gate events, retries, ...).
  agent_templates:
    LlmAgent: {}
    agent_gate: {}
